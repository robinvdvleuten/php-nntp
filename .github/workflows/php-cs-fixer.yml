name: PHP CS Fixer

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
    php-cs-fixer:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
              with:
                php-version: '8.4'
            - uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v4
            - run: vendor/bin/php-cs-fixer check --diff -v
